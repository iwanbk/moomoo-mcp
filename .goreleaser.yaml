version: 2

project_name: moomoo-mcp

before:
  hooks:
    - go mod tidy

builds:
  - id: moomoo-mcp
    main: ./cmd/moomoo-mcp
    binary: moomoo-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: moomoo-mcp
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: iwanbk
    name: moomoo-mcp
